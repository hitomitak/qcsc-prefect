[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sbd"
version = "0.1.0"
description = "Prefect workflow of SBD experiment from arXiv:2511.00224."
authors = [
    { name = "Yuto Morohoshi", email = "mrhsyut@ibm.com" }
]
maintainers = [
    { name = "Yuto Morohoshi", email = "mrhsyut@ibm.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ffsim==0.0.84",
    "qiskit-addon-sqd",
    "prefect-qiskit",
    "prefect[aws]>=3.4.14",
    "pydantic_numpy",
    "qcsc_workflow_utility",
]

[project.optional-dependencies]
# Ray is an optional task runner backend. Without it, the flow uses the
# ProcessPoolTaskRunner / ConcurrentTaskRunner (see SBD_TASK_RUNNER).
ray = ["prefect-ray"]

[tool.uv.sources]
qcsc_workflow_utility = { path = "../qcsc_workflow_utility", editable = true }

[tool.setuptools]
packages = ["sbd"]
include-package-data = true
zip-safe = false

[project.scripts]
sbd-deploy = "sbd.main:deploy"
