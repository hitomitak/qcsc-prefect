name: Publish packages to TestPyPI

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish built distributions to TestPyPI"
        required: true
        default: "false"

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine setuptools wheel

      - name: Read package version
        id: package-version
        run: |
          VERSION=$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("packages/qcsc-prefect/pyproject.toml").read_text())["project"]["version"])')
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Build all packages
        run: bash scripts/build-all-packages.sh

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Smoke test core installation
        run: |
          python -m venv "${RUNNER_TEMP}/qcsc-smoke-core"
          "${RUNNER_TEMP}/qcsc-smoke-core/bin/python" -m pip install --upgrade pip
          "${RUNNER_TEMP}/qcsc-smoke-core/bin/python" -m pip install --find-links dist "qcsc-prefect==${{ steps.package-version.outputs.version }}"
          "${RUNNER_TEMP}/qcsc-smoke-core/bin/python" scripts/smoke-test-packages.py

      - name: Smoke test Qiskit extra installation
        run: |
          python -m venv "${RUNNER_TEMP}/qcsc-smoke-qiskit"
          "${RUNNER_TEMP}/qcsc-smoke-qiskit/bin/python" -m pip install --upgrade pip
          "${RUNNER_TEMP}/qcsc-smoke-qiskit/bin/python" -m pip install --find-links dist "qcsc-prefect[qiskit]==${{ steps.package-version.outputs.version }}"
          "${RUNNER_TEMP}/qcsc-smoke-qiskit/bin/python" scripts/smoke-test-packages.py

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to TestPyPI
    needs: build
    if: ${{ inputs.publish == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/qcsc-prefect
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
