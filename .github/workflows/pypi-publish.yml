name: Publish packages to PyPI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine setuptools wheel

      - name: Check release version
        run: python scripts/check-release-version.py --tag "${GITHUB_REF_NAME}"

      - name: Build all packages
        run: bash scripts/build-all-packages.sh

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Smoke test core installation
        run: |
          python -m venv "${RUNNER_TEMP}/qcsc-smoke-core"
          "${RUNNER_TEMP}/qcsc-smoke-core/bin/python" -m pip install --upgrade pip
          "${RUNNER_TEMP}/qcsc-smoke-core/bin/python" -m pip install --find-links dist "qcsc-prefect==${GITHUB_REF_NAME#v}"
          "${RUNNER_TEMP}/qcsc-smoke-core/bin/python" scripts/smoke-test-packages.py

      - name: Smoke test Qiskit extra installation
        run: |
          python -m venv "${RUNNER_TEMP}/qcsc-smoke-qiskit"
          "${RUNNER_TEMP}/qcsc-smoke-qiskit/bin/python" -m pip install --upgrade pip
          "${RUNNER_TEMP}/qcsc-smoke-qiskit/bin/python" -m pip install --find-links dist "qcsc-prefect[qiskit]==${GITHUB_REF_NAME#v}"
          "${RUNNER_TEMP}/qcsc-smoke-qiskit/bin/python" scripts/smoke-test-packages.py

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/qcsc-prefect
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
