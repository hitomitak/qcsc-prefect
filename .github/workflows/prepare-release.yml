name: Prepare release

on:
  workflow_dispatch:
    inputs:
      old_version:
        description: "Current qcsc-prefect package version"
        required: true
      new_version:
        description: "New qcsc-prefect package version"
        required: true

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release branch
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine setuptools wheel

      - name: Bump package versions
        run: python scripts/bump-version.py "${{ inputs.old_version }}" "${{ inputs.new_version }}"

      - name: Build all packages
        run: bash scripts/build-all-packages.sh

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Smoke test core installation
        run: |
          python -m venv "${RUNNER_TEMP}/qcsc-smoke-core"
          "${RUNNER_TEMP}/qcsc-smoke-core/bin/python" -m pip install --upgrade pip
          "${RUNNER_TEMP}/qcsc-smoke-core/bin/python" -m pip install --find-links dist "qcsc-prefect==${{ inputs.new_version }}"
          "${RUNNER_TEMP}/qcsc-smoke-core/bin/python" scripts/smoke-test-packages.py

      - name: Smoke test Qiskit extra installation
        run: |
          python -m venv "${RUNNER_TEMP}/qcsc-smoke-qiskit"
          "${RUNNER_TEMP}/qcsc-smoke-qiskit/bin/python" -m pip install --upgrade pip
          "${RUNNER_TEMP}/qcsc-smoke-qiskit/bin/python" -m pip install --find-links dist "qcsc-prefect[qiskit]==${{ inputs.new_version }}"
          "${RUNNER_TEMP}/qcsc-smoke-qiskit/bin/python" scripts/smoke-test-packages.py

      - name: Create release branch
        env:
          NEW_VERSION: ${{ inputs.new_version }}
        run: |
          BRANCH="release/v${NEW_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${BRANCH}"
          git add packages/*/pyproject.toml
          git commit -m "Bump version to ${NEW_VERSION}"
          git push --set-upstream origin "${BRANCH}"
          {
            echo "### Release branch created"
            echo
            echo "- Branch: \`${BRANCH}\`"
            echo "- PR title: \`Release v${NEW_VERSION}\`"
            echo "- Commit message: \`Bump version to ${NEW_VERSION}\`"
            echo "- Open a pull request manually from \`${BRANCH}\` into \`main\`."
            echo "- After merge, publish by pushing tag \`v${NEW_VERSION}\`."
          } >> "${GITHUB_STEP_SUMMARY}"
